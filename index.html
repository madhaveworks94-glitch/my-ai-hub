<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI hub</title>
<style>
body{margin:0;background:#06060a;color:#e8e8f0;font-family:monospace;display:flex;flex-direction:column;height:100dvh}
#bar{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #2a2a3a}
#ttl{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bar button{background:#0d0d14;color:inherit;border:1px solid #2a2a3a;padding:8px 12px;font:inherit}
#side{position:fixed;left:0;top:53px;bottom:0;width:80%;max-width:320px;background:#0d0d14;border-right:1px solid #2a2a3a;overflow-y:auto;z-index:5}
#side[hidden]{display:none}
.row{display:flex;align-items:center;border-bottom:1px solid #1c1c28}
.row .nm{flex:1;text-align:left;background:none;color:inherit;border:0;padding:14px 12px;font:inherit}
.row .x{background:none;color:#8a8aa0;border:0;padding:0 14px;font:inherit}
#log{flex:1;overflow-y:auto;padding:12px}
.m{margin:8px 0;padding:10px;border:1px solid #2a2a3a}
.m .tx{white-space:pre-wrap}
.m .at{color:#b8a8ff;margin-top:6px}
.m pre{margin:8px 0;padding:8px;background:#0d0d14;overflow-x:auto;white-space:pre}
.u{border-color:#6b5bd6}
.err{border-color:#a33;color:#f99}
.lk{display:inline-block;margin:8px 12px 0 0;background:none;border:0;color:#8a8aa0;padding:0;font:inherit;text-decoration:underline}
.art{display:inline-block;margin:8px 8px 0 0;background:#6b5bd6;color:#fff;border:0;padding:10px 14px;font:inherit}
#editbar{padding:6px 10px;color:#b8a8ff;border-top:1px solid #2a2a3a}
#editbar[hidden]{display:none}
#editbar button{background:none;border:0;color:#8a8aa0;font:inherit;text-decoration:underline}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;border-top:1px solid #2a2a3a}
#chips[hidden]{display:none}
.chip{background:#0d0d14;border:1px solid #2a2a3a;padding:4px 8px}
.chip button{background:none;border:0;color:#8a8aa0;font:inherit;margin-left:6px;padding:0}
form{display:flex;gap:8px;padding:8px;border-top:1px solid #2a2a3a}
input,textarea{background:#0d0d14;color:inherit;border:1px solid #2a2a3a;padding:12px;font:inherit}
form input{flex:1}
form button{background:#6b5bd6;color:#fff;border:0;padding:0 16px;font:inherit}
#att{background:#0d0d14;color:inherit;border:1px solid #2a2a3a;padding:0 12px}
.ov{position:fixed;inset:0;background:#06060a;z-index:20;display:flex;flex-direction:column}
.ov[hidden]{display:none}
.hd{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #2a2a3a}
.hd span{flex:1}
.hd button,.btn{background:#0d0d14;color:inherit;border:1px solid #2a2a3a;padding:8px 12px;font:inherit}
#af{flex:1;border:0;background:#fff}
#skbody{flex:1;overflow-y:auto;padding:12px}
#skbody input,#skbody textarea{width:100%;box-sizing:border-box;margin:6px 0}
#skbody textarea{min-height:120px}
.srow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1c1c28}
.srow .sn{flex:1}
.srow input{width:22px;height:22px;margin:0;padding:0}
.btn.p{background:#6b5bd6;color:#fff;border-color:#6b5bd6}
</style>
</head>
<body>
<div id="bar"><button id="menu">☰</button><span id="ttl">My AI hub</span><button id="skbtn">Skills</button><button id="newc">+ New</button></div>
<div id="side" hidden></div>
<div id="log"></div>
<div id="editbar" hidden>Editing a message. <button type="button" id="cancel">Cancel</button></div>
<div id="chips" hidden></div>
<form id="f"><button type="button" id="att">📎</button><input id="t" placeholder="Message" autocomplete="off"><button>Send</button></form>
<input type="file" id="file" multiple hidden accept="image/*,video/*,.txt,.md,.csv,.json,.js,.py,.html,.css,.xml,.log">

<div id="art" class="ov" hidden>
  <div class="hd"><span>Artifact</span><button id="adl">Download</button><button id="acl">Close</button></div>
  <iframe id="af" sandbox="allow-scripts"></iframe>
</div>

<div id="sk" class="ov" hidden>
  <div class="hd"><span>Skills</span><button id="skx">Close</button></div>
  <div id="skbody">
    <div id="sklist"></div>
    <h4 id="skform">Add a skill</h4>
    <input id="sn" placeholder="Skill name">
    <textarea id="si" placeholder="Instructions the AI should follow"></textarea>
    <button class="btn p" id="sksave">Save skill</button>
    <button class="btn" id="skclear">Clear</button>
  </div>
</div>

<script>
let secret = localStorage.getItem('app_secret') || prompt('Enter app secret');
if (secret) localStorage.setItem('app_secret', secret);
const $ = id => document.getElementById(id);
let convId = null, msgs = [], convs = [], editing = null, busy = false, lastError = '';
let skills = [], editingSkill = null, curArt = null;
let pending = [], proc = false;
const MAXIMG = 8;

async function api(method, qs, body) {
  const r = await fetch('/api/chat' + (qs || ''), {
    method,
    headers: { 'Content-Type': 'application/json', 'x-app-secret': secret },
    body: body ? JSON.stringify(body) : undefined
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401) { localStorage.removeItem('app_secret'); throw new Error('Wrong secret. Reload and re-enter.'); }
  if (!r.ok) throw new Error(JSON.stringify(d.error || d));
  return d;
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { busy = false; lastError = e.message; render(); } };
const runA = fn => async (...a) => { try { await fn(...a); } catch (e) { alert(e.message); } };

/* ---------- attachments ---------- */
function imgCount(list) { return list.reduce((n, a) => n + (a.images ? a.images.length : 0), 0); }
function renderChips() {
  const c = $('chips');
  c.innerHTML = '';
  pending.forEach((a, i) => {
    const s = document.createElement('span');
    s.className = 'chip';
    s.textContent = (a.kind === 'text' ? '📄 ' : '🖼 ') + a.name;
    const x = document.createElement('button');
    x.type = 'button';
    x.textContent = '✕';
    x.onclick = () => { pending.splice(i, 1); renderChips(); };
    s.appendChild(x);
    c.appendChild(s);
  });
  if (proc) { const s = document.createElement('span'); s.className = 'chip'; s.textContent = 'Processing…'; c.appendChild(s); }
  c.hidden = !pending.length && !proc;
}
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Cannot read this image.')); i.src = src; });
}
function drawScaled(src, w, h, max, q) {
  const k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * k));
  cv.height = Math.max(1, Math.round(h * k));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', q);
}
function seek(v, t) {
  return new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('Video seek timed out.')), 10000);
    v.onseeked = () => { clearTimeout(to); res(); };
    v.currentTime = t;
  });
}
async function fileToAtt(file, room) {
  if (file.type.startsWith('image/')) {
    if (room < 1) throw new Error('Too many images (max ' + MAXIMG + ').');
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImg(url);
      return { kind: 'image', name: file.name, images: [drawScaled(img, img.naturalWidth, img.naturalHeight, 1024, 0.7)] };
    } finally { URL.revokeObjectURL(url); }
  }
  if (file.type.startsWith('video/')) {
    if (room < 6) throw new Error('A video needs room for 6 frames (max ' + MAXIMG + ' images total).');
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    try {
      await new Promise((res, rej) => {
        v.onloadedmetadata = res;
        v.onerror = () => rej(new Error('Cannot read this video.'));
        v.src = url;
        setTimeout(() => rej(new Error('Video took too long to load.')), 15000);
      });
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) throw new Error('Cannot read video length.');
      const N = 6, frames = [];
      for (let i = 0; i < N; i++) {
        await seek(v, dur * (i + 0.5) / N);
        frames.push(drawScaled(v, v.videoWidth, v.videoHeight, 768, 0.6));
      }
      return { kind: 'image', name: file.name, images: frames };
    } finally { URL.revokeObjectURL(url); }
  }
  if (file.size > 300000) throw new Error(file.name + ' is too large (max about 300 KB of text).');
  const text = await file.text();
  if (text.includes('\u0000')) throw new Error(file.name + ' is not a plain text file.');
  return { kind: 'text', name: file.name, text: text.slice(0, 20000) };
}

/* ---------- messages ---------- */
function parts(content) {
  const out = [];
  const re = /```(\w*)\n([\s\S]*?)(?:```|$)/g;
  let last = 0, m;
  while ((m = re.exec(content))) {
    if (m.index > last) out.push({ t: 'text', v: content.slice(last, m.index) });
    out.push({ t: 'code', lang: m[1].toLowerCase(), v: m[2] });
    last = re.lastIndex;
  }
  if (last < content.length) out.push({ t: 'text', v: content.slice(last) });
  return out;
}
function openArt(lang, code) {
  const html = lang === 'svg' ? '<!doctype html><body style="margin:0;background:#fff">' + code : code;
  curArt = html;
  $('af').srcdoc = html;
  $('art').hidden = false;
}
function addText(box, v) {
  if (!v.trim()) return;
  const c = document.createElement('div');
  c.className = 'tx';
  c.textContent = v.trim();
  box.appendChild(c);
}
function render() {
  const log = $('log');
  log.innerHTML = '';
  msgs.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'm' + (m.role === 'user' ? ' u' : '');
    if (m.role === 'user') {
      addText(d, m.content);
      if (m.att && m.att.length) {
        const a = document.createElement('div');
        a.className = 'at';
        a.textContent = '📎 ' + m.att.map(x => x.name).join(', ');
        d.appendChild(a);
      }
      if (m.id) {
        const b = document.createElement('button');
        b.className = 'lk';
        b.textContent = 'Edit';
        b.onclick = () => startEdit(i);
        d.appendChild(b);
      }
    } else {
      parts(m.content).forEach(p => {
        if (p.t === 'text') { addText(d, p.v); return; }
        if (p.lang === 'html' || p.lang === 'svg') {
          const b = document.createElement('button');
          b.className = 'art';
          b.textContent = 'Open artifact';
          b.onclick = () => openArt(p.lang, p.v);
          d.appendChild(b);
        } else {
          const pre = document.createElement('pre');
          pre.textContent = p.v;
          d.appendChild(pre);
        }
      });
    }
    log.appendChild(d);
  });
  if (busy) { const d = document.createElement('div'); d.className = 'm'; d.textContent = 'Thinking…'; log.appendChild(d); }
  if (lastError) { const d = document.createElement('div'); d.className = 'm err'; d.textContent = 'Error: ' + lastError; log.appendChild(d); }
  log.scrollTop = log.scrollHeight;
}
function setTitle() { $('ttl').textContent = (convs.find(c => c.id === convId) || {}).title || 'My AI hub'; }
function renderSide() {
  const s = $('side');
  s.innerHTML = '';
  convs.forEach(c => {
    const row = document.createElement('div');
    row.className = 'row';
    const n = document.createElement('button');
    n.className = 'nm';
    n.textContent = c.title;
    n.onclick = run(() => openConv(c.id));
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '✕';
    x.onclick = run(() => delConv(c.id));
    row.appendChild(n);
    row.appendChild(x);
    s.appendChild(row);
  });
}
async function loadList() { const d = await api('GET', '?list=1'); convs = d.conversations; renderSide(); setTitle(); }
async function openConv(id) {
  convId = id;
  localStorage.setItem('conv', id);
  lastError = '';
  cancelEdit();
  const d = await api('GET', '?conversation=' + id);
  msgs = d.messages.map(m => ({ ...m, att: m.att_meta || [] }));
  setTitle();
  render();
  $('side').hidden = true;
}
async function newChat() {
  const c = await api('POST', '', { action: 'new' });
  await loadList();
  await openConv(c.id);
}
async function delConv(id) {
  if (!confirm('Delete this chat?')) return;
  await api('POST', '', { action: 'delete', conversation_id: id });
  await loadList();
  if (convId === id) { if (convs.length) await openConv(convs[0].id); else await newChat(); }
}
function startEdit(i) {
  editing = i;
  $('t').value = msgs[i].content;
  $('editbar').firstChild.textContent = msgs[i].att && msgs[i].att.length ? 'Editing a message (its attachments are not kept). ' : 'Editing a message. ';
  $('editbar').hidden = false;
  $('t').focus();
}
function cancelEdit() { editing = null; $('editbar').hidden = true; }

/* ---------- skills ---------- */
function renderSkills() {
  const box = $('sklist');
  box.innerHTML = '';
  if (!skills.length) box.textContent = 'No skills yet.';
  skills.forEach(s => {
    const row = document.createElement('div');
    row.className = 'srow';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = s.enabled;
    cb.onchange = runA(async () => {
      await api('POST', '', { action: 'skill_toggle', id: s.id, enabled: cb.checked });
      s.enabled = cb.checked;
    });
    const nm = document.createElement('span');
    nm.className = 'sn';
    nm.textContent = s.name;
    const ed = document.createElement('button');
    ed.className = 'btn';
    ed.textContent = 'Edit';
    ed.onclick = () => { editingSkill = s.id; $('sn').value = s.name; $('si').value = s.instructions; $('skform').textContent = 'Edit skill'; };
    const x = document.createElement('button');
    x.className = 'btn';
    x.textContent = '✕';
    x.onclick = runA(async () => {
      if (!confirm('Delete this skill?')) return;
      await api('POST', '', { action: 'skill_delete', id: s.id });
      await loadSkills();
    });
    row.append(cb, nm, ed, x);
    box.appendChild(row);
  });
}
async function loadSkills() { const d = await api('GET', '?skills=1'); skills = d.skills; renderSkills(); }
function clearSkillForm() { editingSkill = null; $('sn').value = ''; $('si').value = ''; $('skform').textContent = 'Add a skill'; }

/* ---------- wiring ---------- */
$('menu').onclick = () => { $('side').hidden = !$('side').hidden; };
$('newc').onclick = run(newChat);
$('cancel').onclick = () => { cancelEdit(); $('t').value = ''; };
$('skbtn').onclick = runA(async () => { await loadSkills(); $('sk').hidden = false; });
$('skx').onclick = () => { $('sk').hidden = true; };
$('skclear').onclick = clearSkillForm;
$('sksave').onclick = runA(async () => {
  const name = $('sn').value.trim(), instructions = $('si').value.trim();
  if (!name || !instructions) { alert('Add a name and instructions.'); return; }
  const cur = skills.find(s => s.id === editingSkill);
  await api('POST', '', { action: 'skill_save', id: editingSkill, name, instructions, enabled: cur ? cur.enabled : true });
  clearSkillForm();
  await loadSkills();
});
$('acl').onclick = () => { $('art').hidden = true; $('af').srcdoc = ''; };
$('adl').onclick = () => {
  if (!curArt) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([curArt], { type: 'text/html' }));
  a.download = 'artifact.html';
  a.click();
};
$('att').onclick = () => $('file').click();
$('file').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  proc = true;
  renderChips();
  for (const f of files) {
    try { pending.push(await fileToAtt(f, MAXIMG - imgCount(pending))); }
    catch (err) { alert(err.message || 'Could not read ' + f.name); }
  }
  proc = false;
  renderChips();
};

$('f').onsubmit = async e => {
  e.preventDefault();
  if (busy || proc) return;
  let text = $('t').value.trim();
  if (!text && !pending.length) return;
  if (!text) text = 'Please look at the attached file(s).';
  const atts = pending;
  try {
    if (!convId) await newChat();
    let truncate = null;
    if (editing !== null) { truncate = msgs[editing].id; msgs = msgs.slice(0, editing); cancelEdit(); }
    $('t').value = '';
    pending = [];
    renderChips();
    lastError = '';
    msgs.push({ role: 'user', content: text, id: null, att: atts.map(a => ({ kind: a.kind, name: a.name })) });
    busy = true;
    render();
    const d = await api('POST', '', {
      action: 'chat',
      conversation_id: convId,
      truncate_from_id: truncate,
      messages: msgs.map(m => ({ role: m.role, content: m.content, id: m.id, att: m.att })),
      new_attachments: atts
    });
    msgs[msgs.length - 1].id = d.user_id;
    msgs.push({ role: 'assistant', content: d.reply, id: d.assistant_id });
    busy = false;
    render();
    loadList().catch(() => {});
  } catch (err) {
    busy = false;
    lastError = err.message;
    $('t').value = text;
    pending = atts;
    renderChips();
    try { const r = await api('GET', '?conversation=' + convId); msgs = r.messages.map(m => ({ ...m, att: m.att_meta || [] })); } catch (_) {}
    render();
  }
};

run(async () => {
  if (!secret) return;
  await loadList();
  const saved = Number(localStorage.getItem('conv'));
  const start = convs.find(c => c.id === saved) || convs[0];
  if (start) await openConv(start.id); else await newChat();
})();
</script>
</body>
</html>
